[project]
name = "jj6502-tests"
version = "0"
requires-python = ">=3.11"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["Harness", "tests"]
addopts = "-ra --strict-markers"
markers = ["sim: needs the headless Pico sim build"]
